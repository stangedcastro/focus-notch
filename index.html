<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; margin: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: "Helvetica Neue", "Helvetica", -apple-system, Arial, sans-serif;
    overflow: hidden;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: flex-start;
  }

  /* the notch and its two fillets travel together */
  .wrap { display: flex; align-items: flex-start; }

  /* ---------- the notch: flat top (flush to screen edge), rounded bottom ---------- */
  .island {
    position: relative;
    /* opaque at the very top so it reads as bezel continuing the menu bar,
       melting into glass as it comes down over the desktop */
    background: linear-gradient(180deg,
      #050506 0%, #050506 30%,
      rgba(9,9,11,.93) 58%, rgba(10,10,12,.86) 100%);
    backdrop-filter: blur(50px) saturate(150%) brightness(.92);
    -webkit-backdrop-filter: blur(50px) saturate(150%) brightness(.92);
    border: .5px solid rgba(255,255,255,.07);
    border-top: none;
    /* no hard drop shadow — it broke the illusion of being part of the panel.
       just enough ambient darkness to seat it. */
    box-shadow:
      0 .5px 0 rgba(255,255,255,.05) inset,
      0 10px 22px rgba(0,0,0,.26);
    border-radius: 0 0 18px 18px;
    overflow: hidden;
    cursor: default;
    transition:
      width .58s cubic-bezier(.32,.72,0,1),
      height .58s cubic-bezier(.32,.72,0,1),
      border-radius .58s cubic-bezier(.32,.72,0,1);
    width: 196px;
    height: 32px;
  }
  .island.expanded {
    width: 312px;
    height: 150px;
    border-radius: 0 0 30px 30px;
  }

  /* ---------- shoulders: concave fillets that carve the notch out of the
       screen edge instead of pasting it on top ---------- */
  .shoulder {
    width: 15px; height: 15px; flex: none; pointer-events: none;
    background: #050506;
  }
  .shoulder.l {
    -webkit-mask-image: radial-gradient(circle 15px at 0 100%, transparent 0 15px, #000 15.4px);
    mask-image: radial-gradient(circle 15px at 0 100%, transparent 0 15px, #000 15.4px);
  }
  .shoulder.r {
    -webkit-mask-image: radial-gradient(circle 15px at 100% 100%, transparent 0 15px, #000 15.4px);
    mask-image: radial-gradient(circle 15px at 100% 100%, transparent 0 15px, #000 15.4px);
  }

  /* ---------- completion flash, on the notch itself ---------- */
  .island::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 130% at 50% 0%,
      rgba(185,234,156,.62) 0%, rgba(127,192,106,.24) 52%, rgba(127,192,106,0) 100%);
    opacity: 0;
  }
  .island.finished::after { animation: notchFlash 2000ms cubic-bezier(.32,.72,0,1) forwards; }
  @keyframes notchFlash {
    0% { opacity: 0; } 10% { opacity: 1; } 28% { opacity: .45; }
    44% { opacity: .85; } 100% { opacity: 0; }
  }

  /* ---------- traveling border light: an SVG that follows the actual notch outline ---------- */
  .border-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .border-path {
    fill: none;
    stroke: var(--accent,#c9b48a);
    stroke-width: 1.4;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    /* short bright comet, mostly gap, traveling around the perimeter */
    stroke-dasharray: 22 78;
    stroke-dashoffset: 0;
    opacity: 0;
    filter: drop-shadow(0 0 3px var(--accent,#c9b48a));
    transition: opacity .55s ease;
  }
  .island.running .border-path {
    opacity: .95;
    animation: travel 3.2s linear infinite;
  }
  /* the traveling light is a minimal-state cue only — hide it while the card is open
     (the fixed collapsed viewBox would otherwise stretch the comet) */
  .island.expanded .border-path { opacity: 0; animation: none; }
  @keyframes travel { to { stroke-dashoffset: -100; } }

  /* ---------- collapsed pill ---------- */
  .pill {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 9px;
    padding: 0 15px;
    opacity: 1; cursor: pointer;
    transition: opacity .26s ease;
  }
  .island.expanded .pill { opacity: 0; pointer-events: none; }

  .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent,#c9b48a);
    box-shadow: 0 0 7px var(--accent,#c9b48a);
    transition: background .4s, box-shadow .4s;
  }
  .dot.running { animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(.7); }
  }
  .pill-name {
    font-size: 12px; font-weight: 500; color: rgba(255,255,255,.9);
    letter-spacing: .01em; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; flex: 1;
  }
  .pill-time {
    font-size: 12.5px; font-weight: 600; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    margin-left: auto; flex-shrink: 0;
  }

  /* ---------- expanded card ---------- */
  .card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 14px 18px 16px;
    opacity: 0; transform: scale(1.03);
    transition: opacity .3s ease .06s, transform .42s cubic-bezier(.32,.72,0,1) .06s;
    pointer-events: none;
  }
  .island.expanded .card { opacity: 1; transform: scale(1); pointer-events: auto; }

  .task {
    font-size: 13px; font-weight: 500; color: rgba(255,255,255,.92);
    letter-spacing: .01em; outline: none; cursor: text;
    padding-right: 22px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-bottom: 1px solid transparent; transition: border-color .2s ease;
    padding-bottom: 2px;
  }
  .task:empty::before {
    content: 'Name this session…'; color: rgba(255,255,255,.3);
  }
  .task:focus { border-color: rgba(255,255,255,.14); }

  .quit {
    position: absolute; top: 11px; right: 13px;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.22); cursor: pointer;
    transition: color .18s ease, background .18s ease;
  }
  .quit:hover { color: rgba(255,255,255,.85); background: rgba(255,255,255,.08); }
  .quit svg { width: 8px; height: 8px; }

  .modes {
    display: flex; gap: 14px; margin-top: 10px;
  }
  .mode {
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.3); cursor: pointer;
    transition: color .22s ease; position: relative; padding-bottom: 3px;
  }
  .mode.on { color: rgba(255,255,255,.9); }
  .mode.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0;
    height: 1.5px; border-radius: 1px; background: var(--accent,#c9b48a);
  }

  .row {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px;
  }
  .time {
    font-size: 38px; font-weight: 300; color: #fff; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    cursor: ns-resize;
    transition: opacity .2s ease;
  }
  .time:hover { opacity: .85; }
  .time .unit { display: block; font-size: 9px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; margin-top: 6px;
    color: rgba(255,255,255,.3); }

  .controls { display: flex; align-items: center; gap: 10px; }
  .ctl {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .14s ease-out, background .18s ease, color .3s ease;
    color: rgba(255,255,255,.9);
  }
  .ctl:active { transform: scale(.9); }
  .ctl.play {
    width: 42px; height: 42px;
    background: var(--accent,#c9b48a); color: #1a1813;
  }
  .ctl.play:hover { filter: brightness(1.08); }
  .ctl.minor { color: rgba(255,255,255,.38); }
  .ctl.minor:hover { color: rgba(255,255,255,.8); }
  .ctl svg { width: 15px; height: 15px; }
  .ctl.play svg { width: 16px; height: 16px; }

  /* the secondary slot crossfades reset → finish-now while a session runs,
     so completing early is one click and the row never shifts */
  .slot { position: relative; }
  .slot .ic {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .24s ease, transform .24s cubic-bezier(.32,.72,0,1);
  }
  .slot .ic.done { opacity: 0; transform: scale(.72); }
  .island.running .slot .ic.reset { opacity: 0; transform: scale(.72); }
  .island.running .slot .ic.done { opacity: 1; transform: scale(1); }
  .island.running .slot { color: #8fce77; }
  .island.running .slot:hover { color: #b9ea9c; background: rgba(127,192,106,.14); }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap" id="wrap">
      <div class="shoulder l"></div>
      <div class="island" id="island" style="--accent:#c9b48a;">
        <svg class="border-svg" id="borderSvg" viewBox="0 0 196 32" preserveAspectRatio="none">
          <path class="border-path" id="borderPath" pathLength="100"
            d="M0,0 H196 V14 A18,18 0 0 1 178,32 H18 A18,18 0 0 1 0,14 Z" />
        </svg>

        <!-- collapsed -->
        <div class="pill">
          <div class="dot" id="dot"></div>
          <div class="pill-name" id="pillName">Focus</div>
          <div class="pill-time" id="pillTime">25:00</div>
        </div>

        <!-- expanded -->
        <div class="card">
          <div class="task" id="task" contenteditable="true" spellcheck="false"></div>
          <div class="quit" id="quit" title="Quit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
              stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
          </div>
          <div class="modes">
            <div class="mode on" data-mode="focus">Focus</div>
            <div class="mode" data-mode="break">Break</div>
          </div>
          <div class="row">
            <div class="time" id="time" title="Scroll to set length">25<span class="unit">min</span></div>
            <div class="controls">
              <div class="ctl minor slot" id="minor" title="Reset / Finish now">
                <span class="ic reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
                  </svg>
                </span>
                <span class="ic done">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12.5l5.2 5.2L20 7"/>
                  </svg>
                </span>
              </div>
              <div class="ctl play" id="play" title="Start / Pause">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5.5v13l11-6.5z"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="shoulder r"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
